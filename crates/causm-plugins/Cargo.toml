[package]
name = "causm-plugins"
version = "0.1.0-alpha.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
causm-core = { path = "../causm-core" }
wasmi = "2.0.0-beta.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
anyhow = "1.0"
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }

[dev-dependencies]
wat = "1.258.0"

