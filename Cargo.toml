[workspace]
members = [
    "crates/*",
    "plugins/*",
   # "lsp"
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
strip = true
panic = "unwind"
lto = false
codegen-units = 256

[profile.test]
opt-level = 0
debug = 1

